<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

            #caja{
                left: 33%;
                background-color: aqua;
                position: relative; /* Imprescindible para que la posición absoluta funcione dentro del cuadro */
                width: 700px;
                height: 700px; /* Cambia padding-bottom por una altura definida */
                border: 2px solid black;
                overflow: hidden; /* Corta cualquier esquina rota por la rotación */
                
            }

            #true{
                position: absolute;
                background-color: gray;
                width: 10px;
                height: 60px;
                border-color: black;
                border-style: solid;
                box-sizing: border-box;
            }

            #true:hover{
                border-color: white;
                border-style: solid;
            }
            
            #false{
                position: absolute;
                background-color: coral;
                width: 10px;
                height: 60px;
                border-color: black;
                border-style: solid;
                box-sizing: border-box;
            }

            #false:hover{
                border-color: white;
                border-style: solid;
            }



            /* Pantalla oscura de fondo */
#modalVictoria {
    display: none; /* Oculta */
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

/* Caja de la modal */
#contenidoModal {
    background-color: white;
    padding: 25px 40px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    font-family: sans-serif;
}

#contenidoModal button {
    margin-top: 15px;
    padding: 10px 20px;
    background-color: coral;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

#contenidoModal button:hover {
    background-color: #e05538;
}

    </style>

</head>
<body>

    <center><h1>UNA AGUJA EN UN PAJAR</h1></center>
    
    <div id="caja"></div>

    <center><h2 id = "pajQuit">Paja quitada: 0</h2></center>

    <div id="modalVictoria">
    <div id="contenidoModal">
        <h2>¡Aguja encontrada! 🎉</h2>
        <p id="textoContador"></p>
        <button onclick="cerrarModal()">Jugar de nuevo</button>
    </div>
</div>

    <audio id="musicaFondo" src="./audio/videoplayback.m4a" loop></audio>
    <audio id="musicaGanar" src="./audio/reelsvideo.io_1779355459733.mp3" autoplay ></audio>
    <audio id="sonido" src="" autoplay ></audio>


    <script>

        const musica = document.getElementById("musicaFondo");

        // Al hacer el primer clic en cualquier parte de la página, arranca el audio de fondo
        window.addEventListener("click", function() {
            if (musica.paused) {
                musica.volume = 0.4; // Ajusta el volumen aquí (de 0.0 a 1.0)
                musica.play();
            }
        }, { once: true });

        const musicaGanar = document.getElementById("musicaGanar");

        function sonidoGanarReproducir(){
                if (musicaGanar.paused) {
                musicaGanar.volume = 1.0; // Ajusta el volumen aquí (de 0.0 a 1.0)
                musicaGanar.play();
            }
        }

        const sonido = document.getElementById("sonido");

        function sonidoAlAzar(){

            let azar = Math.floor((Math.random() * (51 - 1)) + 1);

            sonido.setAttribute("src", `./audio/s${azar}.mp3`)
            if (sonido.paused) {
                sonido.volume = 1.0; // Ajusta el volumen aquí (de 0.0 a 1.0)
                sonido.play();
            }
        }


        let caja = document.getElementById("caja");
        let pajQuit = document.getElementById("pajQuit");

        let contador = 0


        let numAzar = Math.floor((Math.random() * (5000 - 1)) + 1);

        // Ancho y alto del palo
        const paloAncho = 10;
        const paloAlto = 60;

        // Límite máximo donde se puede colocar la esquina superior izquierda
        const maxLeft = caja.clientWidth - paloAncho;
        const maxTop = caja.clientHeight - paloAlto;

        for (let i = 1; i <= 5000; i++) {

            let div = document.createElement("div");

            if(i == numAzar){
                div.setAttribute("id", "true");
            }
            else{
                div.setAttribute("id", "false");
            }

            // 1. Generar ángulo aleatorio de 0 a 360 grados
            let angulo = Math.floor(Math.random() * 360);

            // 2. Aplicar la posición usando las variables maxLeft y maxTop de la caja
            div.style.left = Math.floor(Math.random() * maxLeft) + "px";
            div.style.top = Math.floor(Math.random() * maxTop) + "px";

            // 3. Aplicar la inclinación
            div.style.transform = "rotate(" + angulo + "deg)";

            caja.appendChild(div);
            
        }

        let paja = document.querySelectorAll("#false")
        let aguja = document.querySelector("#true")

        for (let i = 0; i < paja.length; i++) {
            paja[i].addEventListener("click", tocaPaja)  
        }

        aguja.addEventListener("click", tocaAguja)  

        function tocaPaja(event) {

            let nodoClick
            
            if(event){
                nodoClick = event.target
                caja.removeChild(nodoClick)
                sonidoAlAzar()
                contador++
                pajQuit.textContent = "Paja quitada: " + contador
            }
        }
        
        function tocaAguja(event) {

            let nodoClick

            if(event){
                nodoClick = event.target
                caja.removeChild(nodoClick)
                sonidoGanarReproducir()

                document.getElementById("textoContador").innerText = "Has quitado " + contador + " pajas.";
                document.getElementById("modalVictoria").style.display = "flex";

                caja.replaceChildren();
            }
        }

    function cerrarModal() {
        console.log("lol")
    }

    </script>

</body>
</html>

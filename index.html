<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una aguja en un pajar</title>
    <link rel="stylesheet" href="./css/estilos.css">
   

</head>

<body>

    <div class="language-selector">
        <ul class="custom-dropdown">
            <li class="selected-option" onclick="toggleMenu()">
                <img id="imgSeleccionada" src="./img/es.png" alt="Español">
                <span id="txtSeleccionado">Español</span>
                ▼
            </li>
            <ul class="options-list" id="listaOpciones">
                <li onclick="seleccionarIdioma('es', './img/es.png', 'Español')">
                    <img src="./img/es.png" alt="Español"> Español
                </li>
                <li onclick="seleccionarIdioma('en', './img/in.png', 'English')">
                    <img src="./img/in.png" alt="English"> English
                </li>
            </ul>
        </ul>
    </div>

    <h1 id="txtTitulo">UNA AGUJA EN UN PAJAR</h1>

    <div id="caja"></div>

    <h2 id="pajQuit">Paja quitada: 0</h2>
    <div id="cronometro">Tiempo: 00:00:00</div>

    <div id="modalVictoria">
        <div id="contenidoModal">
            <h2 id="txtVictoria">¡Aguja encontrada!</h2>
            <p id="textoContador"></p>
            <p id="textoTiempo"></p>
            <button id="btnReiniciar" onclick="cerrarModal()">Jugar de nuevo</button>
        </div>
    </div>

    <audio id="musicaFondo" src="./audio/videoplayback.m4a" loop></audio>
    <audio id="musicaGanar" src="./audio/reelsvideo.io_1779355459733.mp3" autoplay></audio>
    <audio id="sonido" src="" autoplay></audio>

    <script src="./js/codigo.js"></script>

</body>
</html>
